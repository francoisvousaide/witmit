<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Appli SPA (page test : navigation sans rechargement + zone qui défile)</title>
<!-- Servie en https:// par le test (page.route) : l'attribut data-mode est remplacé à la volée pour le mode live -->
<script src="/witmit.js" data-project="spa" MODE_ATTRS></script>
<style>
  html, body { margin:0; height:100%; overflow:hidden; font-family:sans-serif; } /* la FENÊTRE ne défile jamais */
  header { height:60px; background:#1f4e5a; color:#fff; display:flex; align-items:center; gap:12px; padding:0 16px; }
  header a { color:#fff; }
  #scroller { position:absolute; top:60px; bottom:0; left:0; right:0; overflow:auto; } /* c'est ELLE qui défile */
  .row { height:60px; border-bottom:1px solid #ccc; display:flex; align-items:center; padding:0 16px; }
  h1 { margin:16px; }
</style>
</head>
<body>
<header><strong>Appli</strong><a href="/accueil" data-nav>Accueil</a><a href="/adhesion" data-nav>Adhésion</a></header>
<div id="scroller"><div id="app"></div></div>
<script>
  function render() {
    var p = location.pathname, n = p === '/adhesion' ? 'Adhésion' : 'Accueil';
    document.title = n + ' — Appli';
    var h = '<h1 id="titre">' + n + '</h1>';
    for (var i = 1; i <= 40; i++) h += '<div class="row" id="r' + i + '">' + n + ' ligne ' + i + '</div>';
    document.getElementById('app').innerHTML = h;
  }
  // Comme Next.js : un clic de lien change l'URL par pushState et redessine, sans recharger la page.
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-nav]'); if (!a) return;
    e.preventDefault(); history.pushState(null, '', a.getAttribute('href')); render();
  });
  window.addEventListener('popstate', render);
  render();
</script>
</body>
</html>
