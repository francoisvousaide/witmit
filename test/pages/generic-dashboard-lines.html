<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kiosque — option lignes (sélection multiple)</title>
<!-- Script dans le <head> exprès : le widget doit attendre que <body> existe -->
<script src="../../src/annotate.js" data-project="kiosque" data-multi-lines="true"></script>
<style>
  /* Aucune variable CSS TellUs ici : le widget doit utiliser ses valeurs de repli */
  body { margin:0; font-family: Georgia, serif; background:#1e1e2e; color:#cdd6f4; }
  .topbar { background:#11111b; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; }
  .topbar .brand { font-weight:bold; letter-spacing:2px; }
  .topbar nav a { color:#89b4fa; margin-left:18px; text-decoration:none; }
  main { max-width:960px; margin:0 auto; padding:24px; }
  .kpi-row { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px; }
  .kpi-tile { background:#313244; border-radius:10px; padding:18px; }
  .kpi-tile .kpi-name { font-size:12px; text-transform:uppercase; color:#a6adc8; }
  .kpi-tile .kpi-value { font-size:32px; margin-top:6px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button { background:#313244; color:#cdd6f4; border:none; padding:8px 16px; border-radius:6px 6px 0 0; cursor:pointer; }
  .tabs button.current { background:#45475a; }
  .tab-pane { display:none; background:#45475a; padding:18px; border-radius:0 10px 10px 10px; }
  .tab-pane.current { display:block; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid #585b70; }
  th { color:#a6adc8; font-weight:normal; font-size:12px; }
  .status-ok { color:#a6e3a1; } .status-late { color:#f38ba8; }
  form label { display:block; margin:10px 0 4px; }
  form input, form select { padding:6px 8px; border-radius:6px; border:1px solid #585b70; background:#1e1e2e; color:#cdd6f4; width:260px; }
  .submit-row { margin-top:16px; }
  .submit-row button { background:#89b4fa; color:#11111b; border:none; padding:10px 18px; border-radius:6px; font-weight:bold; }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">KIOSQUE</span>
  <nav><a href="#">Ventes</a><a href="#">Stocks</a><a href="#">Réglages</a></nav>
</header>
<main>
  <h1>Tableau de bord</h1>
  <section class="kpi-row">
    <article class="kpi-tile"><div class="kpi-name">Chiffre du jour</div><div class="kpi-value">1 240 €</div></article>
    <article class="kpi-tile"><div class="kpi-name">Commandes</div><div class="kpi-value">37</div></article>
    <article class="kpi-tile"><div class="kpi-name">Panier moyen</div><div class="kpi-value">33,5 €</div></article>
  </section>

  <div class="tabs">
    <button class="current" id="tabBtnOrders" onclick="showTab('orders')">Commandes</button>
    <button id="tabBtnForm" onclick="showTab('form')">Nouvelle commande</button>
  </div>
  <div class="tab-pane current" id="paneOrders">
    <table>
      <thead><tr><th>N°</th><th>Client</th><th>Montant</th><th>Statut</th></tr></thead>
      <tbody>
        <tr><td>1041</td><td>Boulangerie Martin</td><td>84,00 €</td><td class="status-ok">Livrée</td></tr>
        <tr><td>1042</td><td>Café des Arts</td><td>156,50 €</td><td class="status-late">En retard</td></tr>
        <tr><td>1043</td><td>Épicerie Lila</td><td>42,00 €</td><td class="status-ok">Livrée</td></tr>
      </tbody>
    </table>
  </div>
  <div class="tab-pane" id="paneForm">
    <form onsubmit="return false;">
      <label for="client">Client</label>
      <input id="client" placeholder="Nom du client">
      <label for="qty">Quantité</label>
      <select id="qty"><option>1</option><option>2</option><option>3</option></select>
      <div class="submit-row"><button type="submit" id="submitOrder">Valider la commande</button></div>
    </form>
  </div>
</main>
<script>
  function showTab(name) {
    document.getElementById('paneOrders').classList.toggle('current', name === 'orders');
    document.getElementById('paneForm').classList.toggle('current', name === 'form');
    document.getElementById('tabBtnOrders').classList.toggle('current', name === 'orders');
    document.getElementById('tabBtnForm').classList.toggle('current', name === 'form');
  }
</script>
</body>
</html>
